<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIMP</title>
    <!--
      Базовые правила страницы (html/body, экраны, hide-cursor) переехали в
      src/client/style.css: в репозитории игры этого index.html нет, а
      standalone SDK импортирует таблицу целиком.

      Здесь остаётся только защита от FOUC этой страницы: pug-разметка
      (лобби, форма входа, scoreboard) видима до исполнения JS, а класса
      vimp-shell на body ещё нет — его ставит ensureGameShell, и дальше
      скрытие держит правило .vimp-shell первого уровня из style.css,
      тождественное этому. В style.css такого правила быть не должно: там
      оно скрывало бы и первый уровень страницы, встраивающей SDK
      (docs/en/standalone.md). Инлайн разрешён прод-CSP:
      style-src 'self' 'unsafe-inline' (src/config/master.js).
    -->
    <style>
      body > * {
        display: none;
      }
    </style>
  </head>
  <body>
    <pug src="./src/client/views/index.pug" />
    <!--
      Единый экземпляр pixi.js в браузере: движок и динамически
      загружаемый game-plugin (@vimp-games/*) оба резолвят "pixi.js" в
      один и тот же файл — иначе у них разные реестры расширений/пайпов
      PixiJS и падение рендера (RenderTargetSystem получает render
      target от «чужого» рендерера). Файлы — самодостаточные ESM-бандлы
      без внешних bare-импортов (собраны esbuild'ом, code-split между
      собой), синхронизируются скриптом scripts/sync-pixi-vendor.mjs
      (predev/prebuild) из node_modules/pixi.js.

      Инлайн обязателен: importmap с атрибутом src не поддерживается ни
      одним браузером (спецификация HTML запрещает src на importmap).
      Внутри этого комментария нельзя писать литеральную разметку тегов —
      vite build парсит её как реальный тег и ломает dist/index.html.
      Прод-CSP (script-src без 'unsafe-inline'/nonce, см.
      packages/engine/src/config/master.js) разрешает именно этот
      инлайн-скрипт по sha256-хэшу — контент ниже статичен, поэтому хэш
      стабилен; менять его нельзя без пересчёта хэша
      (scripts/check-importmap-csp-hash.mjs, запускается postbuild) и
      обновления script-src в master.js и в Nginx-сниппетах доков.
    -->
    <script type="importmap">{"imports":{"pixi.js":"/vendor/pixi/index.js","pixi.js/unsafe-eval":"/vendor/pixi/unsafe-eval.js"}}</script>
    <script type="module" src="./src/client//main.js"></script>
  </body>
</html>
