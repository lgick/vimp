<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIMP</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }

      body {
        background-color: #000;
        color: #ccc;
        font-family: 'Lucida Grande', Helvetica, Arial, Verdana, sans-serif;
        font-size: 12px;
        line-height: 16px;
      }

      body > * {
        display: none;
      }

      body.hide-cursor {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <pug src="./src/client/views/index.pug" />
    <!--
      Единый экземпляр pixi.js в браузере: движок и динамически
      загружаемый game-plugin (@vimp-games/*) оба резолвят "pixi.js" в
      один и тот же файл — иначе у них разные реестры расширений/пайпов
      PixiJS и падение рендера (RenderTargetSystem получает render
      target от «чужого» рендерера). Файлы — самодостаточные ESM-бандлы
      без внешних bare-импортов (собраны esbuild'ом, code-split между
      собой), синхронизируются скриптом scripts/sync-pixi-vendor.mjs
      (predev/prebuild) из node_modules/pixi.js.

      Внешний файл, а не инлайновый JSON: прод-CSP (script-src без
      'unsafe-inline'/nonce, см. packages/engine/src/config/master.js)
      блокирует инлайновый importmap; same-origin src проходит под 'self'.
    -->
    <script type="importmap" src="/vendor/pixi/importmap.json"></script>
    <script type="module" src="./src/client//main.js"></script>
  </body>
</html>
