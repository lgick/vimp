<svg viewBox="0 0 960 580" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновая подложка страницы лобби -->
  <rect width="960" height="580" fill="#262626" />
  
  <!-- ================= ЛЕВАЯ КОЛОНКА: Настройки (Стандартные HTML-элементы, Без изменений) ================= -->
  <rect x="40" y="40" width="410" height="500" fill="#2d2d2d" rx="4" stroke="#444" stroke-width="1" />
  
  <text x="60" y="80" fill="#fff" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="1">VIMP</text>
  <text x="60" y="115" fill="#aaa" font-family="sans-serif" font-size="13">Signed in as <tspan fill="#fff" font-weight="bold">lgick</tspan></text>
  <rect x="350" y="100" width="80" height="22" fill="#efefef" stroke="#767676" stroke-width="1" rx="2" />
  <text x="390" y="115" fill="#000" font-family="sans-serif" font-size="11" text-anchor="middle">Sign out</text>
  <line x1="60" y1="140" x2="430" y2="140" stroke="#3d3d3d" stroke-width="1" />
  <text x="60" y="175" fill="#ccc" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">HOST A GAME</text>
  
  <!-- Селектор игры -->
  <text x="60" y="212" fill="#aaa" font-family="sans-serif" font-size="13">Select Game</text>
  <rect x="230" y="195" width="200" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="238" y="211" fill="#000" font-family="sans-serif" font-size="12">VIMP Tanks</text>
  <rect x="411" y="196" width="18" height="22" fill="#efefef" stroke="#767676" stroke-width="1" />
  <polygon points="417,209 423,209 420,214" fill="#000" />
  <polygon points="417,205 423,205 420,200" fill="#000" />
  
  <!-- Имя сервера -->
  <text x="60" y="252" fill="#aaa" font-family="sans-serif" font-size="13">Server name...</text>
  <rect x="230" y="235" width="200" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="238" y="251" fill="#000" font-family="sans-serif" font-size="12">test server</text>
  
  <!-- Параметры -->
  <text x="60" y="292" fill="#aaa" font-family="sans-serif" font-size="13">Max players</text>
  <rect x="370" y="275" width="60" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="378" y="291" fill="#000" font-family="sans-serif" font-size="12">8</text>
  
  <text x="60" y="332" fill="#aaa" font-family="sans-serif" font-size="13">Round time (s)</text>
  <rect x="370" y="315" width="60" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="378" y="331" fill="#000" font-family="sans-serif" font-size="12">120</text>
  
  <text x="60" y="372" fill="#aaa" font-family="sans-serif" font-size="13">Map time (s)</text>
  <rect x="370" y="355" width="60" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="378" y="371" fill="#000" font-family="sans-serif" font-size="12">600</text>
  
  <text x="60" y="412" fill="#aaa" font-family="sans-serif" font-size="13">Friendly fire</text>
  <rect x="414" y="398" width="16" height="16" fill="#fff" stroke="#767676" stroke-width="1" />
  <polyline points="417,406 420,410 427,399" fill="none" stroke="#000" stroke-width="2" />
  
  <text x="60" y="452" fill="#aaa" font-family="sans-serif" font-size="13">Map</text>
  <rect x="310" y="435" width="120" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="318" y="451" fill="#000" font-family="sans-serif" font-size="12">pool mini</text>
  <rect x="411" y="436" width="18" height="22" fill="#efefef" stroke="#767676" stroke-width="1" />
  <polygon points="417,449 423,449 420,454" fill="#000" />
  <polygon points="417,445 423,445 420,440" fill="#000" />
  
  <rect x="180" y="490" width="140" height="28" fill="#efefef" stroke="#767676" stroke-width="1" rx="2" />
  <text x="250" y="508" fill="#000" font-family="sans-serif" font-size="12" text-anchor="middle">Create server</text>
  
  <!-- ================= ПРАВАЯ КОЛОНКА: Рейтинг (Вкладка Leaderboard активна, Полный Топ-10) ================= -->
  <rect x="490" y="40" width="430" height="500" fill="#2d2d2d" rx="4" stroke="#444" stroke-width="1" />
  
  <!-- Переключатель вкладок -->
  <!-- Вкладка 1 (Неактивная) -->
  <rect x="510" y="55" width="140" height="30" fill="none" />
  <text x="580" y="75" fill="#888" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Active Servers</text>
  
  <!-- Вкладка 2 (Активная) -->
  <rect x="660" y="55" width="110" height="30" fill="none" />
  <text x="715" y="75" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Leaderboard</text>
  <line x1="660" y1="87" x2="770" y2="87" stroke="#fff" stroke-width="2" />
  
  <line x1="510" y1="88" x2="900" y2="88" stroke="#444" stroke-width="1" />
  
  <!-- Метаданные рейтинга для выбранной игры Tanks -->
  <text x="510" y="112" fill="#ccc" font-family="sans-serif" font-size="13" font-weight="bold">TANKS TOP-10</text>
  <text x="900" y="112" fill="#888" font-family="sans-serif" font-size="12" text-anchor="end">Total: 3400 players</text>
  
  <!-- Строки таблицы лидеров (Полный Топ-10 в сером цвете текста) -->
  <!-- 1. player3 -->
  <rect x="510" y="130" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="146" fill="#ccc" font-family="monospace" font-size="12">1. player3</text>
  <text x="885" y="146" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">1500 pts</text>
  
  <!-- 2. user203 -->
  <rect x="510" y="158" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="174" fill="#ccc" font-family="monospace" font-size="12">2. user203</text>
  <text x="885" y="174" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">1420 pts</text>
  
  <!-- 3. gameboy -->
  <rect x="510" y="186" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="202" fill="#ccc" font-family="monospace" font-size="12">3. gameboy</text>
  <text x="885" y="202" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">1390 pts</text>
  
  <!-- 4. daddy -->
  <rect x="510" y="214" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="230" fill="#ccc" font-family="monospace" font-size="12">4. daddy</text>
  <text x="885" y="230" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">1250 pts</text>
  
  <!-- 5. commander -->
  <rect x="510" y="242" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="258" fill="#ccc" font-family="monospace" font-size="12">5. commander</text>
  <text x="885" y="258" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">1100 pts</text>

  <!-- 6. sniper -->
  <rect x="510" y="270" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="286" fill="#ccc" font-family="monospace" font-size="12">6. sniper</text>
  <text x="885" y="286" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">1050 pts</text>

  <!-- 7. warrior -->
  <rect x="510" y="298" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="314" fill="#ccc" font-family="monospace" font-size="12">7. warrior</text>
  <text x="885" y="314" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">1010 pts</text>

  <!-- 8. ace_tank -->
  <rect x="510" y="326" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="342" fill="#ccc" font-family="monospace" font-size="12">8. ace_tank</text>
  <text x="885" y="342" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">990 pts</text>

  <!-- 9. blaster -->
  <rect x="510" y="354" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="370" fill="#ccc" font-family="monospace" font-size="12">9. blaster</text>
  <text x="885" y="370" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">970 pts</text>

  <!-- 10. rookie -->
  <rect x="510" y="382" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="398" fill="#ccc" font-family="monospace" font-size="12">10. rookie</text>
  <text x="885" y="398" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">950 pts</text>
  
  <!-- Визуальный разделитель (многоточие) -->
  <text x="705" y="423" fill="#666" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">...</text>
  
  <!-- Секция фиксации текущего пользователя на его 20-м месте (в том же стиле и цвете) -->
  <rect x="510" y="435" width="390" height="24" fill="#363636" rx="2" stroke="#444" stroke-width="1" />
  <text x="525" y="451" fill="#ccc" font-family="monospace" font-size="12">20. lgick</text>
  <text x="885" y="451" fill="#aaa" font-family="monospace" font-size="12" text-anchor="end">240 pts</text>
</svg>
