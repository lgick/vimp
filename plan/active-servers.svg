<svg viewBox="0 0 960 580" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Фоновая подложка страницы лобби -->
  <rect width="960" height="580" fill="#262626" />
  
  <!-- ================= ЛЕВАЯ КОЛОНКА: Настройки (Стандартные HTML-элементы) ================= -->
  <rect x="40" y="40" width="410" height="500" fill="#2d2d2d" rx="4" stroke="#444" stroke-width="1" />
  
  <!-- Заголовок VIMP -->
  <text x="60" y="80" fill="#fff" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="1">VIMP</text>
  
  <!-- Профиль пользователя -->
  <text x="60" y="115" fill="#aaa" font-family="sans-serif" font-size="13">Signed in as <tspan fill="#fff" font-weight="bold">lgick</tspan></text>
  <!-- Стандартная HTML-кнопка (Sign out) -->
  <rect x="350" y="100" width="80" height="22" fill="#efefef" stroke="#767676" stroke-width="1" rx="2" />
  <text x="390" y="115" fill="#000" font-family="sans-serif" font-size="11" text-anchor="middle">Sign out</text>
  
  <line x1="60" y1="140" x2="430" y2="140" stroke="#3d3d3d" stroke-width="1" />
  <text x="60" y="175" fill="#ccc" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="0.5">HOST A GAME</text>
  
  <!-- Выбор игры (Стандартный HTML Select) -->
  <text x="60" y="212" fill="#aaa" font-family="sans-serif" font-size="13">Select Game</text>
  <rect x="230" y="195" width="200" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="238" y="211" fill="#000" font-family="sans-serif" font-size="12">VIMP Tanks</text>
  <!-- Системная кнопка выбора (Dropdown) -->
  <rect x="411" y="196" width="18" height="22" fill="#efefef" stroke="#767676" stroke-width="1" />
  <polygon points="417,209 423,209 420,214" fill="#000" />
  <polygon points="417,205 423,205 420,200" fill="#000" />
  
  <!-- Имя сервера (Стандартный HTML Input Text) -->
  <text x="60" y="252" fill="#aaa" font-family="sans-serif" font-size="13">Server name...</text>
  <rect x="230" y="235" width="200" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="238" y="251" fill="#000" font-family="sans-serif" font-size="12">test server</text>
  
  <!-- Max players (Стандартный HTML Input Text) -->
  <text x="60" y="292" fill="#aaa" font-family="sans-serif" font-size="13">Max players</text>
  <rect x="370" y="275" width="60" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="378" y="291" fill="#000" font-family="sans-serif" font-size="12">8</text>
  
  <!-- Round time (Стандартный HTML Input Text) -->
  <text x="60" y="332" fill="#aaa" font-family="sans-serif" font-size="13">Round time (s)</text>
  <rect x="370" y="315" width="60" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="378" y="331" fill="#000" font-family="sans-serif" font-size="12">120</text>
  
  <!-- Map time (Стандартный HTML Input Text) -->
  <text x="60" y="372" fill="#aaa" font-family="sans-serif" font-size="13">Map time (s)</text>
  <rect x="370" y="355" width="60" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="378" y="371" fill="#000" font-family="sans-serif" font-size="12">600</text>
  
  <!-- Friendly fire (Стандартный HTML Checkbox) -->
  <text x="60" y="412" fill="#aaa" font-family="sans-serif" font-size="13">Friendly fire</text>
  <rect x="414" y="398" width="16" height="16" fill="#fff" stroke="#767676" stroke-width="1" />
  <polyline points="417,406 420,410 427,399" fill="none" stroke="#000" stroke-width="2" />
  
  <!-- Map (Стандартный HTML Select) -->
  <text x="60" y="452" fill="#aaa" font-family="sans-serif" font-size="13">Map</text>
  <rect x="310" y="435" width="120" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="318" y="451" fill="#000" font-family="sans-serif" font-size="12">pool mini</text>
  <rect x="411" y="436" width="18" height="22" fill="#efefef" stroke="#767676" stroke-width="1" />
  <polygon points="417,449 423,449 420,454" fill="#000" />
  <polygon points="417,445 423,445 420,440" fill="#000" />
  
  <!-- Кнопка Create Server (Стандартный HTML Submit) -->
  <rect x="180" y="490" width="140" height="28" fill="#efefef" stroke="#767676" stroke-width="1" rx="2" />
  <text x="250" y="508" fill="#000" font-family="sans-serif" font-size="12" text-anchor="middle">Create server</text>
  
  <!-- ================= ПРАВАЯ КОЛОНКА: Браузер (Вкладка Active Servers активна) ================= -->
  <rect x="490" y="40" width="430" height="500" fill="#2d2d2d" rx="4" stroke="#444" stroke-width="1" />
  
  <!-- Переключатель вкладок -->
  <!-- Вкладка 1 (Активная) -->
  <rect x="510" y="55" width="140" height="30" fill="none" />
  <text x="580" y="75" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Active Servers</text>
  <line x1="510" y1="87" x2="650" y2="87" stroke="#fff" stroke-width="2" />
  
  <!-- Вкладка 2 (Неактивная) -->
  <rect x="660" y="55" width="110" height="30" fill="none" />
  <text x="715" y="75" fill="#888" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Leaderboard</text>
  
  <line x1="510" y1="88" x2="900" y2="88" stroke="#444" stroke-width="1" />
  
  <!-- Строка Поиска (Стандартный HTML Input) -->
  <rect x="510" y="105" width="390" height="24" fill="#fff" stroke="#767676" stroke-width="1" />
  <text x="518" y="121" fill="#000" font-family="sans-serif" font-size="12">tanks/</text>
  <!-- Имитация мигающего каретки в инпуте -->
  <line x1="558" y1="110" x2="558" y2="124" stroke="#000" stroke-width="1" />
  
  <!-- Карточка сервера 1 (Tanks - Тест) -->
  <rect x="510" y="145" width="390" height="65" fill="#363636" rx="3" stroke="#4a4a4a" stroke-width="1" />
  <text x="525" y="172" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">tanks/test server</text>
  <text x="525" y="193" fill="#aaa" font-family="sans-serif" font-size="12">pool mini · 0/8 · RU</text>
  <text x="820" y="177" fill="#4caf50" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">0</text>
  <text x="885" y="177" fill="#ffff00" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">42 ms</text>
  
  <!-- Карточка сервера 2 (Tanks - Классика, выше Space Arena по сортировке пинга) -->
  <rect x="510" y="220" width="390" height="65" fill="#363636" rx="3" stroke="#4a4a4a" stroke-width="1" />
  <text x="525" y="247" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">tanks/classic match</text>
  <text x="525" y="268" fill="#aaa" font-family="sans-serif" font-size="12">dusty path · 5/8 · DE</text>
  <text x="820" y="252" fill="#e57373" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">-1</text>
  <text x="885" y="252" fill="#ffff00" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">55 ms</text>
  
  <!-- Сервер space_arena/ полностью отсутствует на экране, так как скрыт фильтром поиска -->
</svg>
