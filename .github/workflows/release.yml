name: Release

# Single-artifact publish fast path via OIDC Trusted Publishing (no npm/crates.io
# tokens stored as secrets). The human still does all local prep — version bump,
# changelog, `write-versions.js` refresh, commit, push to main — exactly as in
# docs/en/publishing.md; this workflow only publishes the chosen artifact and
# tags the release. It does not enforce the crate → engine → create-vimp-game
# order, that stays the human's responsibility for multi-artifact releases —
# see docs/en/publishing.md, "The CI way".
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options:
          - vimp-engine
          - create-vimp-game
          - vimp-engine-core

permissions:
  contents: write
  id-token: write

jobs:
  npm-vimp-engine:
    if: inputs.package == 'vimp-engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing needs npm >= 11.5.1; older npm silently falls back
      # to the legacy token flow and the publish fails with ENEEDAUTH
      - name: Update npm
        run: npm install -g npm@latest

      - name: Read version
        id: version
        run: |
          v=$(node -p "require('./packages/engine/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Guard against re-publish
        run: |
          set -e
          published=$(npm view "vimp-engine@${{ steps.version.outputs.version }}" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "vimp-engine@${{ steps.version.outputs.version }} is already on npm" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish -w vimp-engine --provenance

      - name: Tag release
        run: |
          git tag "vimp-engine@${{ steps.version.outputs.version }}"
          git push origin "vimp-engine@${{ steps.version.outputs.version }}"

  npm-create-vimp-game:
    if: inputs.package == 'create-vimp-game'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Update npm
        run: npm install -g npm@latest

      - name: Read version
        id: version
        run: |
          v=$(node -p "require('./packages/create-vimp-game/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Guard against re-publish
        run: |
          set -e
          published=$(npm view "create-vimp-game@${{ steps.version.outputs.version }}" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "create-vimp-game@${{ steps.version.outputs.version }} is already on npm" >&2
            exit 1
          fi

      # prepack (scripts/write-versions.js) runs automatically here and
      # stamps whatever packages/engine/{package.json,core/Cargo.toml} say
      # in this checkout — it reads the local repo tree, not the registry
      - name: Publish to npm
        run: npm publish -w create-vimp-game --provenance

      - name: Tag release
        run: |
          git tag "create-vimp-game@${{ steps.version.outputs.version }}"
          git push origin "create-vimp-game@${{ steps.version.outputs.version }}"

  crate-vimp-engine-core:
    if: inputs.package == 'vimp-engine-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Read version
        id: version
        run: |
          v=$(awk -F'"' '/^\[package\]/{p=1} p && /^version *=/{print $2; exit}' packages/engine/core/Cargo.toml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Guard against re-publish
        run: |
          set -e
          published=$(curl -sf "https://crates.io/api/v1/crates/vimp-engine-core" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log((j.versions||[]).some(v=>v.num==='${{ steps.version.outputs.version }}')?'yes':'no')}catch{console.log('no')}})")
          if [ "$published" = "yes" ]; then
            echo "vimp-engine-core ${{ steps.version.outputs.version }} is already on crates.io" >&2
            exit 1
          fi

      # Exchanges this job's OIDC token for a short-lived crates.io API
      # token (CARGO_REGISTRY_TOKEN) via Trusted Publishing; no long-lived
      # secret needed. The action revokes the token in its post step.
      - name: crates.io Trusted Publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish -p vimp-engine-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Tag release
        run: |
          git tag "vimp-engine-core@${{ steps.version.outputs.version }}"
          git push origin "vimp-engine-core@${{ steps.version.outputs.version }}"
