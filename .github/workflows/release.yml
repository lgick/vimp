name: Release

# Publish via OIDC Trusted Publishing (no npm/crates.io tokens stored as
# secrets). All local prep — version bump, changelog, `write-versions.js`
# refresh, commit — is still done by `npm run release`, which also creates
# and pushes the artifact's git tag. This workflow does not create tags —
# it runs FROM one: the tag push is what triggers it. See
# docs/en/publishing.md.
on:
  push:
    tags:
      - 'vimp-engine@*'
      - 'create-vimp-game@*'
      - 'vimp-engine-core@*'

permissions:
  contents: read
  id-token: write

jobs:
  npm-vimp-engine:
    if: startsWith(github.ref, 'refs/tags/vimp-engine@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # GITHUB_ENV, not an ${{ }} expression inside run: — a tag name is
      # attacker-shaped text, and an expression is pasted into the script
      # before bash parses it
      - name: Read version
        run: echo "VERSION=${GITHUB_REF_NAME##*@}" >> "$GITHUB_ENV"

      # The tag triggers this run, but npm publishes the version in the
      # file: a tag on a commit carrying another version would publish that
      # one, or fail on a confusing "cannot publish over". Checked before any
      # install — a wrong tag should cost nothing.
      - name: Verify tag matches package version
        run: |
          file=$(jq -r .version packages/engine/package.json)
          if [ "$file" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME, but packages/engine/package.json says $file" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing needs npm >= 11.5.1; older npm silently falls back
      # to the legacy token flow and the publish fails with ENEEDAUTH
      - name: Update npm
        run: npm install -g npm@latest

      - name: Guard against re-publish
        run: |
          set -e
          published=$(npm view "vimp-engine@$VERSION" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "vimp-engine@$VERSION is already on npm" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish -w vimp-engine --provenance

  npm-create-vimp-game:
    if: startsWith(github.ref, 'refs/tags/create-vimp-game@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # GITHUB_ENV, not an ${{ }} expression inside run: — a tag name is
      # attacker-shaped text, and an expression is pasted into the script
      # before bash parses it
      - name: Read version
        run: echo "VERSION=${GITHUB_REF_NAME##*@}" >> "$GITHUB_ENV"

      # The tag triggers this run, but npm publishes the version in the
      # file: a tag on a commit carrying another version would publish that
      # one, or fail on a confusing "cannot publish over". Checked before any
      # install — a wrong tag should cost nothing.
      - name: Verify tag matches package version
        run: |
          file=$(jq -r .version packages/create-vimp-game/package.json)
          if [ "$file" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME, but packages/create-vimp-game/package.json says $file" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Update npm
        run: npm install -g npm@latest

      - name: Guard against re-publish
        run: |
          set -e
          published=$(npm view "create-vimp-game@$VERSION" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "create-vimp-game@$VERSION is already on npm" >&2
            exit 1
          fi

      # prepack (scripts/write-versions.js) runs automatically here and
      # stamps whatever packages/engine/{package.json,core/Cargo.toml} say
      # in this checkout — it reads the local repo tree, not the registry
      - name: Publish to npm
        run: npm publish -w create-vimp-game --provenance

  crate-vimp-engine-core:
    if: startsWith(github.ref, 'refs/tags/vimp-engine-core@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Read version
        run: echo "VERSION=${GITHUB_REF_NAME##*@}" >> "$GITHUB_ENV"

      # The tag triggers this run, but cargo publishes the version in
      # Cargo.toml: a tag on a commit carrying another version would publish
      # that one instead.
      - name: Verify tag matches crate version
        run: |
          file=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vimp-engine-core") | .version')
          if [ "$file" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME, but packages/engine/core/Cargo.toml says $file" >&2
            exit 1
          fi

      - name: Guard against re-publish
        run: |
          set -e
          # the crates.io API (api/v1/crates/...) rejects curl's default
          # User-Agent with 403; the sparse index doesn't require one and
          # is the same source scripts/release/registry.js polls locally
          if curl -sf "https://index.crates.io/vi/mp/vimp-engine-core" \
              | grep -q "\"vers\":\"$VERSION\""; then
            echo "vimp-engine-core $VERSION is already on crates.io" >&2
            exit 1
          fi

      # Exchanges this job's OIDC token for a short-lived crates.io API
      # token (CARGO_REGISTRY_TOKEN) via Trusted Publishing; no long-lived
      # secret needed. The action revokes the token in its post step.
      - name: crates.io Trusted Publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish -p vimp-engine-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
