name: Lint & Test

# запуск на каждый push и pull request
on:
  push:
    branches: ['**']
  pull_request:

# lint не требует Rust; engine доказывает, что движковые тесты (cargo +
# vitest engine-*) проходят БЕЗ единого Rust-артефакта игры (fixture-миниигра,
# packages/engine/tests/fixtures/miniGame/) и гоняет vitest-проект auth
# (packages/auth — central auth-сервис, чистый Node/Express, без Rust/WASM
# зависимостей). Игровые (tanks/integration) job'ы переехали в CI
# репозитория игры (A3.5 плана отделения движка).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      # Только add-server.sh: остальные deployment-скрипты (delete-server.sh,
      # install-system.sh) уже содержат pre-existing shellcheck-warnings вне
      # объёма этого коммита (310fea4) — заводить их отдельно.
      - name: Shellcheck (add-server.sh)
        run: shellcheck --severity=warning .github/deployment/add-server.sh

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (vimp-engine-core)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-engine-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Rust tests (движковый crate)
        run: cargo test -p vimp-engine-core

      - name: JS tests (движок, без Rust-артефактов игры)
        run: npx vitest run --project engine-node --project engine-client

      - name: JS tests (central auth-сервис, packages/auth — не тянет Rust)
        run: npx vitest run --project auth

  # scaffold разворачивает шаблон create-vimp-game во временный каталог и
  # гоняет полный цикл игры (cargo + wasm-pack + build + sim). Проверка идёт
  # против НЕСОБРАННОГО релиза: движок ставится тарболлом npm pack, крейт
  # подменяется [patch.crates-io] — иначе job судил бы шаблон по уже
  # опубликованным версиям. В локальный npm test не входит (минуты).
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (vimp-engine-core)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-scaffold-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: npm ci

      - name: Scaffold a game and run its full cycle
        run: npm run test:scaffold -- --dir "$RUNNER_TEMP/scaffold"
