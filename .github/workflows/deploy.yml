name: Build & Deploy

on:
  push:
    branches: ['main']

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ====================================================
  # 1. СБОРКА И ПУБЛИКАЦИЯ ОБРАЗА
  # ====================================================
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          # тот же central auth-сервис, что и VIMP_AUTH_SERVICE_URL ниже в
          # job'е deploy — здесь подставляется в клиентский бандл на этапе
          # сборки (Vite), см. Dockerfile
          build-args: |
            VITE_AUTH_SERVICE_URL=${{ vars.AUTH_SERVICE_URL }}
          # Кэширование (ускоряет сборку)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================================
  # 1b. СБОРКА И ПУБЛИКАЦИЯ ОБРАЗА AUTH-СЕРВИСА (Этап B6)
  # ====================================================
  # Отдельный образ: packages/auth не тянет Rust/Vite, деплоится как
  # самостоятельный сервис (свой домен, PostgreSQL) — см. docs/en/deployment.md
  build_and_push_auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Lowercase Image Name
        run: |
          echo "AUTH_IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-auth" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/auth/Dockerfile
          push: true
          tags: ${{ env.AUTH_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

  # ====================================================
  # 1c. ДЕПЛОЙ AUTH-СЕРВИСА + МИГРАЦИИ БД
  # ====================================================
  deploy_auth:
    needs: [build_and_push_auth]
    if: vars.AUTH_SERVER_IP != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy auth service
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTH_SERVICE_URL: ${{ vars.AUTH_SERVICE_URL }}
          # ники админов платформы (модерация игр): роль пишется в БД при
          # каждом выпуске токена, поэтому список правится переменной, а не
          # руками в базе
          VIMP_ADMIN_NICKS: ${{ vars.VIMP_ADMIN_NICKS }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.AUTH_SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: AUTH_SERVICE_URL,VIMP_ADMIN_NICKS,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -e

            # каталог домена создаёт add-server.sh; имя = хост из URL сервиса
            AUTH_DOMAIN="${AUTH_SERVICE_URL#*://}"
            AUTH_DOMAIN="${AUTH_DOMAIN%%/*}"
            PROJECT_DIR="$HOME/vimp_projects/${AUTH_DOMAIN}"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "========================================================"
              echo "❌ ERROR: '$PROJECT_DIR' не найден."
              echo "   Запустите './add-server.sh' для auth-домена на сервере."
              echo "========================================================"
              exit 1
            fi

            cd "$PROJECT_DIR"

            echo "🔐 Logging into GHCR..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Список админов приезжает каждым деплоем: .env.prod auth-стека
            # пишется один раз при провижининге (add-server.sh), а env_file
            # читается только при СОЗДАНИИ контейнера — поэтому строку
            # переписываем идемпотентно и пересоздаём контейнер ниже. Та же
            # ловушка описана для VIMP_AUTH_ALLOWED_ORIGINS в
            # docs/en/deployment.md
            #
            # Пустое значение НЕ переписывает строку: незаданная переменная
            # репозитория означала бы VIMP_ADMIN_NICKS= — и syncRole разжаловал
            # бы всех суперадминов при следующем входе. Чтобы список
            # ОЧИСТИТЬ намеренно, правьте .env.prod на сервере
            if [ -n "${VIMP_ADMIN_NICKS}" ]; then
              echo "🔑 Updating VIMP_ADMIN_NICKS..."
              touch .env.prod
              grep -v '^VIMP_ADMIN_NICKS=' .env.prod > .env.prod.next || true
              echo "VIMP_ADMIN_NICKS=${VIMP_ADMIN_NICKS}" >> .env.prod.next
              mv .env.prod.next .env.prod
              chmod 600 .env.prod
            else
              echo "🔑 VIMP_ADMIN_NICKS is empty — keeping the list already on the server"
            fi

            echo "🚀 Pulling and Restarting..."
            docker compose pull
            # --force-recreate: без пересоздания изменённый env_file
            # контейнер не перечитает
            docker compose up -d --force-recreate auth
            docker compose up -d

            # миграции идемпотентны (CREATE TABLE/INDEX IF NOT EXISTS), поэтому
            # гоняются на каждом деплое; ретраи — на прогрев контейнера auth
            echo "🗃️  Applying migrations..."
            MIGRATED=0
            for attempt in $(seq 1 10); do
              if docker compose exec -T auth node src/db/migrate.js; then
                MIGRATED=1
                break
              fi
              sleep 2
            done

            if [ "$MIGRATED" -ne 1 ]; then
              echo "❌ ERROR: миграции не прошли. Логи: docker compose logs auth"
              exit 1
            fi

            docker image prune -f || true

            echo "✅ Auth service deployed for ${AUTH_DOMAIN}"

  # ====================================================
  # 2. ПОДГОТОВКА СПИСКА СЕРВЕРОВ
  # ====================================================
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: set-matrix
        env:
          # Конфигурации из GitHub Repository Variables
          SERVERS_JSON: ${{ vars.SERVERS_MATRIX }}
        run: |
          # Формат JSON в одну строку
          JSON=$(echo "$SERVERS_JSON" | jq -c .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  # ====================================================
  # 3. ДЕПЛОЙ НА КАЖДЫЙ СЕРВЕР
  # ====================================================
  deploy:
    needs: [build_and_push, prepare-matrix]
    runs-on: ubuntu-latest
    strategy:
      # Если один сервер упал/не настроен, остальные продолжат обновляться
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.servers) }}

    steps:
      - name: Lowercase Image Name for Deploy
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Deploy to ${{ matrix.domain }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VIMP_DOMAIN: ${{ matrix.domain }}
          VIMP_PORT: ${{ matrix.port }}
          # общий для всех мастеров central auth-сервис (Этап B6); задаётся
          # один раз в Settings → Variables, см. docs/en/deployment.md
          VIMP_AUTH_SERVICE_URL: ${{ vars.AUTH_SERVICE_URL }}
          # корень хранилища игровых пакетов: мастер качает одобренные игры
          # из npm registry сам, поэтому путь должен переживать пересоздание
          # контейнера — это смонтированный том (см. volumes ниже)
          VIMP_GAMES_DIR: /var/vimp/games
          # необязательное поле матрицы: задано — бокс поднимается
          # dedicated-сервером одной игры (без лобби и OAuth), пусто —
          # обычным лобби-мастером, см. docs/en/deployment.md
          VIMP_DEDICATED_GAME: ${{ matrix.dedicatedGame }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ matrix.ip }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Передача переменных окружения внутрь скрипта SSH.
          # Имя, не перечисленное здесь, ssh-action не пробрасывает — пропуск
          # VIMP_DEDICATED_GAME означает молчаливый старт в лобби-режиме
          envs: IMAGE_NAME,VIMP_DOMAIN,VIMP_PORT,VIMP_AUTH_SERVICE_URL,VIMP_GAMES_DIR,VIMP_DEDICATED_GAME,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            # Остановка выполнения при любой критической ошибке
            set -e

            PROJECT_DIR="$HOME/vimp_projects/${VIMP_DOMAIN}"

            echo "🔍 Checking status for ${VIMP_DOMAIN}..."

            # Если папки нет, значит сервер не был настроен через add-server.sh.
            # Прерываем выполнение с кодом 1 (Failure), чтобы пайплайн упал с ошибкой.
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "========================================================"
              echo "⚠️  SKIP: Server is not configured on VPS."
              echo "   Directory '$PROJECT_DIR' does not exist."
              echo "   Run './add-server.sh' on the server to setup first."
              echo "========================================================"
              echo "❌ ERROR: Deployment failed because folder is missing."
              exit 1
            fi
            # -----------------------

            cd "$PROJECT_DIR"

            echo "🔐 Logging into GHCR..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            echo "📄 Generating .env config..."

            {
              echo "NODE_ENV=production"
              echo "VIMP_DOMAIN=$VIMP_DOMAIN"
              if [ -n "$VIMP_AUTH_SERVICE_URL" ]; then
                echo "VIMP_AUTH_SERVICE_URL=$VIMP_AUTH_SERVICE_URL"
              fi
              echo "VIMP_GAMES_DIR=$VIMP_GAMES_DIR"
              if [ -n "$VIMP_DEDICATED_GAME" ]; then
                echo "VIMP_DEDICATED_GAME=$VIMP_DEDICATED_GAME"
              fi
            } > .env.prod


            echo "🐳 Generating docker-compose.yml..."
            # Конфиг Docker.
            # container_name должен быть уникальным для каждого домена.
            # ports: 127.0.0.1 - чтобы порт был закрыт снаружи (безопасность).
            {
              echo "services:"
              echo "  master:"
              echo "    image: $IMAGE_NAME:latest"
              echo "    container_name: \"vimp-${VIMP_DOMAIN}\""
              echo "    restart: always"
              echo "    env_file: .env.prod"
              echo "    ports:"
              # СЛЕВА: Порт на сервере (уникальный из JSON, например 3005)
              # СПРАВА: Порт мастера внутри контейнера (всегда 3002)
              echo "      - \"127.0.0.1:${VIMP_PORT}:3002\""
              # хранилище скачанных игровых пакетов переживает пересоздание
              # контейнера: иначе каждый деплой заново тянул бы из npm все
              # игры каталога
              echo "    volumes:"
              echo "      - \"vimp-games:${VIMP_GAMES_DIR}\""
              echo "volumes:"
              echo "  vimp-games:"
            } > docker-compose.yml

            echo "🚀 Pulling and Restarting..."

            # Обновление образа
            docker compose pull

            # Пересоздание контейнера (удалит старый и запустит новый)
            docker compose up -d --force-recreate --remove-orphans

            # `docker compose up -d` возвращает успех и тогда, когда процесс
            # внутри падает сразу после старта: контейнер уходит в
            # restart-петлю, домен отдаёт 502, а деплой остаётся зелёным. Так
            # выглядит, например, игра, собранная под прошлый
            # ENGINE_API_VERSION, в dedicated-режиме: лобби такую игру просто
            # выбрасывает из каталога и живёт дальше, а dedicated падает на
            # старте — подменить нечем. Поэтому ждём, пока мастер реально
            # начнёт отвечать на своём порту.
            echo "🩺 Checking container after start..."
            CONTAINER="vimp-${VIMP_DOMAIN}"
            HEALTHY=0
            STATUS="unknown"

            for attempt in $(seq 1 20); do
              sleep 3
              STATUS=$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo missing)

              # restarting/exited — процесс уже упал, ждать нечего
              if [ "$STATUS" != "running" ]; then
                break
              fi

              if command -v curl >/dev/null 2>&1; then
                if curl -fsS -o /dev/null -m 5 "http://127.0.0.1:${VIMP_PORT}/"; then
                  HEALTHY=1
                  break
                fi
              elif [ "$attempt" -ge 4 ]; then
                # curl на сервере нет: доказательства ответа не будет, но
                # прожитые ~12 секунд отсекают именно restart-петлю
                HEALTHY=1
                break
              fi
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "========================================================"
              echo "❌ ERROR: ${CONTAINER} не обслуживает 127.0.0.1:${VIMP_PORT}"
              echo "   Статус контейнера: ${STATUS}"
              echo "   Последние строки лога:"
              echo "========================================================"
              docker compose logs --tail 50 master || true
              exit 1
            fi

            echo "🩺 Container is serving on 127.0.0.1:${VIMP_PORT} (${STATUS})"

            # Чистка старых неиспользуемых образов, чтобы не забивать диск
            docker image prune -f || true

            echo "✅ Deployment Finished for ${VIMP_DOMAIN}"
